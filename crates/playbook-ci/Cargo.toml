[package]
name = "playbook-ci"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Evidence-gated CI runner: executes the gate matrix and emits CI_EVIDENCE/1 envelopes."

[[bin]]
name = "playbook-ci"
path = "src/main.rs"

[dependencies]
ci-evidence = { path = "../ci-evidence" }
playbook-core = { path = "../playbook-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone build workspace: the root workspace manifest is owned by another
# workstream; this crate builds with
#   PATH="$HOME/.cargo/bin:$PATH" cargo build --manifest-path crates/playbook-ci/Cargo.toml --offline
