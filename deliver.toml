[[command]]
name = "cargo fmt"
cmd = ["cargo", "fmt", "--all", "--check"]
expect_exit = 0
timeout_secs = 120

[[command]]
name = "cargo clippy"
cmd = ["cargo", "clippy", "--offline", "--all-targets", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "cargo test"
cmd = ["cargo", "test", "--offline"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

