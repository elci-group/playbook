[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
uuid = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
